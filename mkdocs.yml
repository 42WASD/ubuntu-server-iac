site_name: Ubuntu Server IAC
site_description: Production-grade system architecture and developer guides for the ubuntu-server-iac project.
site_author: jyao
site_url: https://42wasd.github.io/ubuntu-server-iac/

# Do not publish the runbook source files as standalone pages; they are
# embedded into the Implementation page by the generator.
exclude_docs: |
  implementation/_runbook/

# Repository Integration
repo_name: 42WASD/ubuntu-server-iac
repo_url: https://github.com/42WASD/ubuntu-server-iac
edit_uri: edit/main/docs/

# Theme Configuration
theme:
  name: material
  language: en
  palette:
    # Light Mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark Mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

