[project]
name = "ubuntu-server-iac-projects"
version = "0.1.0"
description = "Documentation and tooling for the ubuntu-server-iac project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.7.0",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mcstatus>=14.1.0",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-testinfra>=10.0.0",
    "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Run the SSOT validation suite. conftest.py adds scripts/docs to sys.path.
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "doc_impact: live-state doc-impact probes (deselect with '-m \"not doc_impact\"')",
    "quick: fast doc-impact battery (host-only, no network probes)",
]
