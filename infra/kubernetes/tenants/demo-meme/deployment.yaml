apiVersion: apps/v1
kind: Deployment
metadata:
  name: meme-site
  namespace: demo-meme
  labels:
    app: meme-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meme-site
  template:
    metadata:
      labels:
        app: meme-site
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: www
              mountPath: /usr/share/nginx/html
      volumes:
        - name: www
          configMap:
            name: meme-site-index