apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-demo
  namespace: dev-games-42wasd-admin
  labels:
    app: minecraft-demo
spec:
  # Scaled to 0: the prd paper-lobby now serves minecraft.42base.com (via
  # velocity on the freed nodePort 30079). Kept at 0 replicas (not deleted) so
  # the world PVC persists for future dev use. Bring it back with
  # `kubectl -n dev-games-42wasd-admin scale deployment minecraft-demo --replicas=1`.
  replicas: 0
  # Vanilla Minecraft is a single in-memory process holding the world on the PVC;
  # it MUST NOT run more than one replica. Use Recreate so a new pod does not
  # start before the old one (which owns the world file) is gone.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft-demo
  template:
    metadata:
      labels:
        app: minecraft-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          image: itzg/minecraft-server:latest
          env:
            - name: EULA
              value: "TRUE"
            - name: ONLINE_MODE
              value: "FALSE"
            - name: MEMORY
              value: "2G"
            # Paper (latest supported release) is used so the TabListPing
            # plugin can load; vanilla cannot run plugins.
            - name: TYPE
              value: "PAPER"
            - name: VERSION
              value: "LATEST"
            # Auto-download the TabListPing plugin into /data/plugins on first
            # start. TabListPing is a Bukkit/Paper plugin; PLUGINS is the itzg
            # var for downloading individual plugin jars by URL. 2.03 supports
            # Paper 26.2 (the current VERSION=LATEST). Only this plugin is
            # installed; nothing else changed.
            - name: PLUGINS
              value: "https://cdn.modrinth.com/data/MwLGimob/versions/JB16ulew/TabListPing-2.03.jar"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: game
              containerPort: 25565
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-demo-data
      # The games namespace is default-deny; egress to the DNS resolver must be
      # allowed for the server to reach Mojang/Paper endpoints and resolve
      # hostnames. platform-networkpolicies already installs an
      # allow-cluster-dns rule; the app NetworkPolicy allows outbound internet
      # (needed to download Paper and the TabListPing plugin on first start).