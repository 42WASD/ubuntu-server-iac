apiVersion: v1
kind: Service
metadata:
  name: minecraft-demo
  namespace: dev-games-42wasd-admin
spec:
  # Converted from NodePort 30079 back to ClusterIP. The prd velocity proxy now
  # owns nodePort 30079 (minecraft.42base.com game edge); dev no longer occupies
  # a public node port. The dev deployment is scaled to 0; when re-enabled it is
  # reachable via `kubectl port-forward` or a fresh nodePort, not via the domain.
  type: ClusterIP
  selector:
    app: minecraft-demo
  ports:
    - name: game
      port: 25565
      targetPort: 25565
      protocol: TCP