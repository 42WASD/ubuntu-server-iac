apiVersion: v1
kind: Service
metadata:
  name: minecraft-demo
  namespace: dev-games-42wasd-admin
spec:
  # ClusterIP — game edge is fronted by the UAE relay -> WireGuard -> this
  # Service (reference Phase 54). Avoids NodePort/LoadBalancer which Kyverno
  # restrict-exposure policy flags. For a dev demo, `kubectl port-forward`
  # reaches it from the LAN.
  type: ClusterIP
  selector:
    app: minecraft-demo
  ports:
    - name: game
      port: 25565
      targetPort: 25565
      protocol: TCP