apiVersion: v1
kind: Service
metadata:
  name: minecraft-demo
  namespace: dev-games-42wasd-admin
spec:
  # NodePort exposes the game on every node at <nodeIP>:<nodePort> so the UAE
  # relay (via the WireGuard tunnel) can DNAT to it without any cluster-facing
  # load balancer. A future game-edge LB can replace this; the Kyverno
  # restrict-nodeport rule is currently Audit mode (flags, not blocks).
  type: NodePort
  # Local preserves the real client (player) IP into the pod instead of Cilium
  # SNAT'ing it. Single-node cluster, so Local has no availability downside
  # here; it is required so the pod sees the player's public IP (relayed via
  # the UAE WireGuard tunnel without MASQUERADE) rather than a node IP.
  externalTrafficPolicy: Local
  selector:
    app: minecraft-demo
  ports:
    - name: game
      port: 25565
      targetPort: 25565
      nodePort: 30079
      protocol: TCP