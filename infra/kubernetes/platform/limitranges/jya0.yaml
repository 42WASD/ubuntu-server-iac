apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: dev-jya0
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 256Mi
        ephemeral-storage: 512Mi
      default:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 2Gi
      max:
        cpu: "4"
        memory: 8Gi
        ephemeral-storage: 20Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: prd-jya0
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 1Gi
      default:
        cpu: "2"
        memory: 2Gi
        ephemeral-storage: 4Gi
      max:
        cpu: "8"
        memory: 16Gi
        ephemeral-storage: 30Gi