# Game namespaces LimitRange — conservative defaults matching their quotas.

# prd-games-42wasd-admin (canonical): max.memory raised to 16Gi for the modded
# ATM10SKY server (2026-11-06). That pack needs an 8 GiB heap, i.e. a 12 GiB
# container limit; the previous 8Gi max would have had the apiserver REJECT the
# pod regardless of quota. The quota's limits.memory (32Gi) is the aggregate
# ceiling that actually bounds total consumption.
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: prd-games-42wasd-admin
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 256Mi
        ephemeral-storage: 512Mi
      default:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 2Gi
      max:
        cpu: "6"
        memory: 16Gi
        ephemeral-storage: 20Gi
---
# dev-games-42wasd-admin (ephemeral staging): intentionally small.
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: dev-games-42wasd-admin
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 256Mi
        ephemeral-storage: 512Mi
      default:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 1Gi
      max:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 10Gi