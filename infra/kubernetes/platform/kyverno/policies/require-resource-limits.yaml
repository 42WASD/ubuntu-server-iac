# Stage 1 (Audit): require resource requests/limits on every container.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require resource requests and limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
spec:
  background: true
  validationFailureAction: Audit
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - "dev-*"
                - "prd-*"
                - "*-games-*"
                - "games-*"
      validate:
        message: "Containers must specify resource requests and limits."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"