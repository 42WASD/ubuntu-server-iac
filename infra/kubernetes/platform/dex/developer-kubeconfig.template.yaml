# Generic developer kubeconfig template — Phase 27 (Dex OIDC, RFC 8628).
#
# This is a TEMPLATE, not a live config. A kubeconfig is inherently
# per-developer: it embeds an OIDC `user` identity that resolves to one GitHub
# account, and each developer gets their own RBAC-scoped context. Sharing a
# single "generic" file would collide on `current-context` and mix identities.
#
# To onboard a developer:
#   1. Copy this template to ~/.kube/config-<tenant>-admin
#      (e.g. ~/.kube/config-42wasd-admin).
#   2. Set the real cluster CA below (from the platform admin config:
#      `kubectl config view --raw` → certificate-authority-data) or use
#      `--certificate-authority` pointing at the CA file.
#   3. Rename the context + user to <tenant>-admin so it is clear whose
#      context it is.
#   4. Ensure the developer's GitHub account is a member of the RBAC group
#      your tenant binds to (Phase 26), e.g. `42WASD:tenant-42wasd-admin`.
#
# Pre-configured contexts: the blocks under `contexts:` are pre-wired so each
# context sets BOTH `user:` (the exec credential — never leave this empty) AND
# a `namespace:`. With a `user:` set, `kubectl config use-context <name>`
# switches namespace *and* keeps device-code auth working; a context created
# with `kubectl config set-context <name> --cluster=alpha --namespace=dev-...`
# (no `--user`) leaves `user:` empty and kubectl falls back to a basic-auth
# "Please enter Username" prompt. So always pre-set `user:` on every context.
#
# To add a context for another tenant namespace, copy one block below, pick a
# descriptive name (e.g. `alpha-games-prd`), and point `namespace:` at it.
# Every context reuses the SAME user (<tenant>-admin) — only the namespace
# changes.
#
# The `kubernetes` Dex client is public (device-code grant), so there is NO
# client-secret to embed — nothing to leak.
apiVersion: v1
kind: Config
clusters:
- cluster:
    # REPLACE: base64 of the cluster CA (from server kubeconfig), OR use
    # certificate-authority: /path/to/ca.crt
    certificate-authority-data: <BASE64_CA>
    server: https://alpha.taild82ced.ts.net:6443
  name: alpha
contexts:
# Default context: tenant dev namespace.
- context:
    cluster: alpha
    user: <tenant>-admin        # REPLACE
    namespace: dev-<tenant>     # REPLACE: default namespace (e.g. dev-42wasd-admin)
  name: <tenant>-admin          # REPLACE
# Optional pre-configured tenant contexts (switch with `kubectl config use-context`):
- context: { cluster: alpha, user: <tenant>-admin, namespace: prd-<tenant> }
  name: alpha-prd
- context: { cluster: alpha, user: <tenant>-admin, namespace: dev-games-<tenant> }
  name: alpha-games-dev
- context: { cluster: alpha, user: <tenant>-admin, namespace: prd-games-<tenant> }
  name: alpha-games-prd
- context: { cluster: alpha, user: <tenant>-admin, namespace: mlops }
  name: alpha-mlops
current-context: <tenant>-admin # REPLACE
kind: Config
users:
- name: <tenant>-admin          # REPLACE
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1
      args:
      - oidc-login
      - get-token
      - --grant-type=device-code
      - --oidc-issuer-url=https://alpha.taild82ced.ts.net
      - --oidc-client-id=kubernetes
      - --oidc-extra-scope=groups
      - --oidc-extra-scope=email
      command: kubectl
      interactiveMode: IfAvailable
      provideClusterInfo: true