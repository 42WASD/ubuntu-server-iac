# Route Dex issuer traffic to the Dex pod over the tailnet.
# Traefik terminates TLS using the Tailscale-issued certificate for the node
# FQDN (alpha.taild82ced.ts.net). The cert/key are provisioned manually into
# the `tailscale-cert` Secret (run `sudo tailscale cert` and `kubectl create
# secret tls`), matching how the cloudflared-token Secret is handled — never
# committed to Git.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dex
  namespace: security
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`alpha.taild82ced.ts.net`) && PathPrefix(`/`)
      services:
        - name: dex
          port: 5556
  tls:
    secretName: tailscale-cert