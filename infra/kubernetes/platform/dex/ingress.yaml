# Route Dex issuer traffic to the Dex pod over the tailnet.
# Traefik terminates TLS using the Tailscale-issued certificate for the node
# FQDN (alpha.taild82ced.ts.net). The cert/key are provisioned manually into
# the `tailscale-cert` Secret (run `sudo tailscale cert` and `kubectl create
# secret tls`), matching how the cloudflared-token Secret is handled — never
# committed to Git.
#
# `ingressClassName: traefik` is REQUIRED: RKE2's Traefik runs with
# `--providers.kubernetescrd.ingressClass=traefik`, so it only processes
# IngressRoutes matching that class. Without it, Traefik ignores this route
# and serves its default certificate with a 404.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dex
  namespace: security
spec:
  ingressClassName: traefik
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`alpha.taild82ced.ts.net`)
      services:
        - name: dex
          port: 5556
  tls:
    secretName: tailscale-cert