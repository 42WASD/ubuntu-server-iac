# Dex OIDC provider (Phase 27 — authentication for Kubernetes developers).
# Serves the OIDC issuer over HTTPS on the tailnet via Traefik TLS (the
# Tailscale cert for alpha.taild82ced.ts.net on port 443). kube-apiserver
# stays on 6443 — no port conflict.
#
# GitHub connector authenticates users; the device-code flow (RFC 8628)
# enables headless `kubectl oidc-login` on alpha.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: security
  labels:
    app: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      serviceAccountName: dex
      securityContext:
        # UID/GID 10000 = dedicated workload identity. Do NOT use 1000: that is
        # the human `jyao` account, and `/` is mounted ext4 `quota,usrquota`.
        # Dex's emptyDir (/tmp, and any spill) lives on `/`, so writes were
        # charged to a person's 10 GiB home quota and killed the container with
        # EDQUOT the moment that quota was full — the same class of failure as
        # the paper-lobby "bad IO" crash loop (see the games incident runbook).
        #
        # `dex-data` (SQLite) is on nvme-fast, which has NO quota, so the DB was
        # never the direct cause; fsGroup 10000 exists so the kubelet keeps the
        # volume group-writable after the UID change.
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.45.1
          # Match the pod securityContext — the image defaults to uid 1001.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - dex
            - serve
            - /etc/dex/config.yaml
          env:
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: dex-github-oauth
                  key: client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-github-oauth
                  key: client-secret
          ports:
            - name: http
              containerPort: 5556
            - name: grpc
              containerPort: 5557
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: data
              mountPath: /var/lib/dex
      volumes:
        - name: config
          configMap:
            name: dex-config
        - name: data
          persistentVolumeClaim:
            claimName: dex-data
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: security
  labels:
    app: dex
spec:
  selector:
    app: dex
  ports:
    - name: http
      port: 5556
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dex-data
  namespace: security
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nvme-fast
  resources:
    requests:
      storage: 1Gi
  volumeMode: Filesystem
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dex
  namespace: security