apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nvme-fast
provisioner: local.csi.openebs.io

allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer

parameters:
  storage: "lvm"
  vgpattern: "vg_k8s_nvme.*"
  fsType: xfs
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nvme-db
provisioner: local.csi.openebs.io

allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

parameters:
  storage: "lvm"
  vgpattern: "vg_k8s_nvme.*"
  fsType: xfs
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hdd-bulk
provisioner: local.csi.openebs.io

allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer

parameters:
  storage: "lvm"
  vgpattern: "vg_k8s_hdd.*"
  fsType: xfs