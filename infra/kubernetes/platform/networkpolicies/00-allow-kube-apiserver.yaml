# Cluster-wide egress allow to the kube-apiserver.
#
# WHY this is required (self-hosted apiserver + default-deny):
#   RKE2 runs the kube-apiserver as a static pod on the node, so the
#   kubernetes Service (ClusterIP 10.43.0.1:443) has its backend on the HOST
#   node IP (e.g. 192.168.8.240:6443), NOT a pod IP.
#
#   Cilium NetworkPolicy CIDR selectors (ipBlock) IGNORE node addressing by
#   default (--policy-cidr-match-mode excludes "nodes"). Therefore an egress
#   rule like ipBlock: 0.0.0.0/0 NEVER matches the apiserver backend, so any
#   pod under default-deny egress cannot reach the apiserver (DNS works only
#   because CoreDNS is a pod whose return path stays in-cluster).
#
# The correct, documented Cilium mechanism is the "kube-apiserver" ENTITY,
# which represents the apiserver both in-cluster and out-of-cluster.
# See https://docs.cilium.io/en/stable/security/policy/language/
#
# CRITICAL — Cilium semantics: ANY endpoint selected by a policy becomes
# DEFAULT-DENY for traffic the policy does not explicitly allow. Therefore a
# blanket `endpointSelector: {}` would make EVERY pod in the cluster
# default-deny egress, silently breaking world/egress for system namespaces
# (kube-system, ingress) that were never meant to be default-deny (this
# outage took down the Cloudflare tunnel, CoreDNS upstream, and app jar
# downloads).
#
# We therefore scope this CCNP to ONLY the tenant namespaces that already
# carry a `default-deny` NetworkPolicy and genuinely need the apiserver:
#   - prd-42wasd-admin, prd-games-42wasd-admin
#   - dev-42wasd-admin, dev-games-42wasd-admin
#   - mlops
# (dev-jya0 / prd-jya0 decommissioned 2026-09-01 — see phase-21 runbook.)
# This matches the namespace labels used by the platform per-namespace
# default-deny NetworkPolicies (platform-networkpolicies). Keep this list in
# sync with those namespaces.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-to-kube-apiserver
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name
        operator: In
        values:
          - prd-42wasd-admin
          - prd-games-42wasd-admin
          - dev-42wasd-admin
          - dev-games-42wasd-admin
          - mlops
  egress:
    - toEntities:
      - kube-apiserver