apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform

  sources:
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      targetRevision: 3.9.0
      helm:
        valueFiles:
          - $values/infra/kubernetes/platform/kyverno/values.yaml
    - repoURL: https://github.com/42WASD/ubuntu-server-iac.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno

  # Two classes of permanent, harmless drift on this Helm-sourced app:
  #
  # 1. The CEL-era CRDs (*.policies.kyverno.io) render with EMPTY
  #    `metadata.labels: {}` and `metadata.annotations: {}` (empty maps) from
  #    the chart. The apiserver stores them with those keys absent, and it
  #    defaults `spec.conversion.strategy: None`. Argo diffs empty-map vs
  #    absent on all 11 CRDs forever, even though `kubectl diff` reports no
  #    change. Verified by structurally diffing the chart-rendered CRD against
  #    the live object: the only differing paths are
  #    metadata.{labels,annotations} and spec.conversion (plus server-managed
  #    metadata/status, which Argo already ignores).
  #
  # 2. `platform-kyverno-migrate-resources` is a Helm `post-upgrade` hook Job.
  #    Argo has no status for it, and Completed Jobs are immutable, so it can
  #    never be marked Synced.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - '.metadata.labels'
        - '.metadata.annotations'
        - '.spec.conversion'
    - group: batch
      kind: Job
      name: platform-kyverno-migrate-resources
      jqPathExpressions:
        - '.status'

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true