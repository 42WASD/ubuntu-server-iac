apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-quotas
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: platform

  source:
    repoURL: https://github.com/42WASD/ubuntu-server-iac.git
    targetRevision: main
    path: infra/kubernetes/platform/quotas

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true