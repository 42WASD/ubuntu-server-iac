apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-openebs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform

  sources:
    - repoURL: https://openebs.github.io/openebs
      chart: openebs
      targetRevision: 4.5.1
      helm:
        valueFiles:
          - $values/infra/kubernetes/platform/openebs/values.yaml
    - repoURL: https://github.com/42WASD/ubuntu-server-iac.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: openebs

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true