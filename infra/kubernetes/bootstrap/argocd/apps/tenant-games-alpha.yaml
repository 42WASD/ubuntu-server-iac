apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-games-alpha
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: tenant-42wasd-admin

  source:
    repoURL: https://github.com/42WASD/42wasd-mc.git
    targetRevision: main
    path: clusters/alpha

  destination:
    server: https://kubernetes.default.svc
    namespace: prd-games-42wasd-admin

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true