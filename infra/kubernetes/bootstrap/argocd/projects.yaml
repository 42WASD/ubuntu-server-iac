apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform infrastructure. May deploy cluster-wide resources.
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenant-jya0
  namespace: argocd
spec:
  description: Tenant jya0 applications.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  sourceRepos:
    - 'https://github.com/42WASD/ubuntu-server-iac.git'
  destinations:
    - server: https://kubernetes.default.svc
      namespace: dev-jya0
    - server: https://kubernetes.default.svc
      namespace: prd-jya0
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenant-42wasd-admin
  namespace: argocd
spec:
  description: Tenant 42wasd-admin applications.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  sourceRepos:
    - 'https://github.com/42WASD/ubuntu-server-iac.git'
  destinations:
    - server: https://kubernetes.default.svc
      namespace: dev-42wasd-admin
    - server: https://kubernetes.default.svc
      namespace: prd-42wasd-admin
    - server: https://kubernetes.default.svc
      namespace: mlops
    - server: https://kubernetes.default.svc
      namespace: dev-games-42wasd-admin
    - server: https://kubernetes.default.svc
      namespace: prd-games-42wasd-admin