---
# Defaults for the `base` role — baseline OS packages, core services, and
# unattended-upgrades policy for all platform hosts (Phase 2).
#
# Override per-host or per-group in inventory to add packages.

base_packages:
  # transport & utilities
  - curl
  - wget
  - git
  - jq
  - vim
  - tmux
  - htop
  - btop
  - tree
  - unzip
  - zip
  - ca-certificates
  - gnupg
  - lsb-release
  - software-properties-common
  # filesystem & lvm
  - acl
  - attr
  - quota
  - lvm2
  - xfsprogs
  # hardware / storage tools
  - smartmontools
  - nvme-cli
  - lm-sensors
  - ethtool
  - iproute2
  # networking & security baseline
  - nftables
  - apparmor-utils
  # updates & time
  - unattended-upgrades
  - needrestart
  - chrony
  # python tooling
  - python3
  - python3-venv
  - python3-pip

# Core services to enable & start at boot.
base_services_enable:
  - chrony

# nftables is installed now, but a platform-owned firewall service is configured
# in the `firewall` role later. Keep it disabled here to avoid a half-configured
# firewall on early hosts.
base_services_disabled:
  - nftables

# unattended-upgrades policy (Phase 2 / Phase 2.1).
# security-only + explicit/controlled reboots (kernel/NVIDIA/RKE2 hosts must not
# be rebooted blindly during work hours).
unattended_reboot_time: "03:00"
unattended_remove_unused_dependencies: true