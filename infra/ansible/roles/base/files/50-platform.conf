# 50-platform.conf — Phase 8: journald storage bound
#
# WHY: without a cap, the systemd journal can grow unbounded and fill the
# system disk, which is fatal for a Kubernetes node. Bound its size and
# retention so logging can never starve the OS/containers of disk space.
#
#   SystemMaxUse    max size of the persistent journal (system logs).
#   SystemKeepFree  keep at least this much free space.
#   RuntimeMaxUse    max size of the volatile /run journal (in-memory).
#   MaxRetentionSec max age of entries before they're dropped.
#   Compress        compress old entries to reduce disk use.
#
# Applied by: systemctl restart systemd-journald (reads /etc/systemd/
# journald.conf.d/)
[Journal]
SystemMaxUse=4G
SystemKeepFree=8G
RuntimeMaxUse=1G
MaxRetentionSec=14day
Compress=yes