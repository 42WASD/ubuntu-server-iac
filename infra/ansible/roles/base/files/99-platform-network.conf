# 99-platform-network.conf — Phase 8: basic IP forwarding
#
# net.ipv4.ip_forward = 1  ->  required for Kubernetes networking (Cilium) and
#                               for routing Pod traffic between nodes.
# net.ipv6.conf.all.forwarding = 1 -> enable IPv6 forwarding for the cluster
#                               and for IPv6-capable Pod/Service traffic.
#
# This is safe and expected on a Kubernetes host; it does NOT turn the host
# into a general router (that also needs masquerading/route rules).
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1