# 99-platform-inotify.conf — Phase 8: inotify limits
#
# WHY: RKE2 workloads and the cluster create many inotify watchers. The
# upstream RKE2 guidance recommends higher than default values. Raising
# max_user_instances avoids "too many open files"-style watcher exhaustion for
# app processes inside Pods; max_user_watches covers files/dirs watched at once.
#
# Applied by:  sysctl --system   (loaded from /etc/sysctl.d/)
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288