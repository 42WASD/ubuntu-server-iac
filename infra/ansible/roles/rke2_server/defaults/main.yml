---
# rke2_server — version pin and install variables (Phase 13: choose and pin the release)

# RKE2 minor line chosen for this design (reference: Phase 13).
rke2_minor: "v1.36"

# EXACT tested patch release, pinned — never float on "latest".
# Discovered 2026-08-XX via https://api.github.com/repos/rancher/rke2/releases
# (latest stable v1.36 non-prerelease tag). Kubernetes v1.36.3.
rke2_version: "v1.36.3+rke2r1"

# The installer reads INSTALL_RKE2_VERSION verbatim from the environment.
# Used by tasks/main.yml when running the get.rke2.io bootstrap.
rke2_install_url: "https://get.rke2.io"

# Where we stash the downloaded installer script (Phase 16). Removed after use.
rke2_install_script: /tmp/rke2-install.sh

# Bundle versions carried by this exact release (recorded for the runbook /
# release-note review; see docs/implementation/_runbook/03-build-the-host/phase-13-pin-rke2-release.md)
rke2_bundle:
  kubernetes: "v1.36.3"
  cilium: "v1.19.6"
  cilium_chart: "1.19.601"
  traefik: "v3.7.8"
  traefik_chart: "40.1.009"
  containerd: "v2.3.3-k3s1"
  etcd: "v3.6.14-k3s1"
  coredns: "v1.14.6"

# ---------------------------------------------------------------------------
# Phase 14 — RKE2 configuration (rendered to /etc/rancher/rke2/config.yaml)
# ---------------------------------------------------------------------------

rke2_server_name: "{{ inventory_hostname }}"

# CNI and ingress (bundled components).
rke2_cni: cilium
rke2_ingress_controller: traefik
rke2_disable_kube_proxy: true

# TLS SANs added to the serving certificate. The management address must be
# present so kubectl over Tailscale presents a valid cert. Prefer the stable
# MagicDNS hostname over the raw 100.x IP (Tailscale can reallocate the IP;
# the DNS name stays tied to the node).
rke2_tls_sans:
  - "{{ network.management_tailscale_dnsname
        if network.management_tailscale_dnsname is defined
        else network.management_tailscale_ipv4 }}"

# Admin kubeconfig stays root/platform-admin controlled (readable by the
# platform-admin group, not world-readable).
rke2_write_kubeconfig_mode: "0640"

# etcd snapshots.
rke2_etcd_snapshot_schedule: "0 */6 * * *"
rke2_etcd_snapshot_retention: 12
rke2_etcd_snapshot_compress: true

# Node labels for future scheduling.
rke2_node_labels:
  - "platform.example.com/role=core"
  - "platform.example.com/storage-nvme=true"
  - "platform.example.com/storage-hdd=true"
  - "platform.example.com/gpu=true"

# Host config path + file ownership.
rke2_config_dir: /etc/rancher/rke2
rke2_config_file: /etc/rancher/rke2/config.yaml
rke2_config_owner: root
rke2_config_group: root

# ---------------------------------------------------------------------------
# kubelet configuration (Phase 14, sub-phase 23.1)
# RKE2 supports kubelet config drop-ins via `kubelet-arg: config-dir=...`.
# Reserve capacity for Linux users + developers + Kubernetes system services
# and protect the host from disk/memory exhaustion.
# ---------------------------------------------------------------------------

# Directory RKE2 scans for kubelet config drop-in files (see config.yaml.j2).
rke2_kubelet_conf_dir: /etc/rancher/rke2/kubelet.conf.d
rke2_kubelet_conf_file: /etc/rancher/rke2/kubelet.conf.d/00-platform.conf

# Reserve capacity outside normal Pod scheduling for Linux + developers.
# Reference target (v1.36, 64 CPU / 128 GiB physical): ~12 CPU / 24 GiB.
rke2_kubelet_system_reserved:
  cpu: "12"
  memory: "24Gi"
  ephemeral-storage: "20Gi"

# Kubernetes system services reservation: ~2 CPU / 4 GiB.
rke2_kubelet_kube_reserved:
  cpu: "2"
  memory: "4Gi"
  ephemeral-storage: "10Gi"

# Hard eviction boundaries to protect the host from exhaustion.
rke2_kubelet_eviction_hard:
  memory.available: "8Gi"
  nodefs.available: "12%"
  imagefs.available: "15%"
  nodefs.inodesFree: "5%"

# Image garbage collection thresholds.
rke2_kubelet_image_gc_high_threshold: 75
rke2_kubelet_image_gc_low_threshold: 60

# Apply the Kubernetes default seccomp profile to Pods that don't set one.
rke2_kubelet_seccomp_default: true

# ---------------------------------------------------------------------------
# Cilium configuration (Phase 15)
# Configure RKE2's *packaged* Cilium via a HelmChartConfig. Do NOT install a
# second upstream Cilium Helm release on top of the bundled chart.
# ---------------------------------------------------------------------------

# Where RKE2 watches for HelmChartConfig resources (created at install time).
rke2_manifests_dir: /var/lib/rancher/rke2/server/manifests
rke2_cilium_config_file: /var/lib/rancher/rke2/server/manifests/rke2-cilium-config.yaml

# Use Cilium's eBPF kube-proxy replacement (matches disable-kube-proxy: true).
rke2_cilium_kube_proxy_replacement: true

# API server reachable via localhost from the Cilium agents on this node.
rke2_cilium_k8s_service_host: localhost
rke2_cilium_k8s_service_port: "6443"

# Observability path: enable Cilium + relay (Hubble), but NOT the UI initially.
# Rationale: stand up the metrics/observability backend first; expose an admin
# web UI only after a private-access policy exists.
rke2_cilium_hubble_enabled: true
rke2_cilium_hubble_relay_enabled: true
rke2_cilium_hubble_ui_enabled: false

# Cilium operator replicas. Defaults to 2 (HA), but on a SINGLE-node cluster
# the second replica requests host ports that can bind only once per node, so
# it sits Pending forever. Scale to 1 explicitly until more nodes join.
rke2_cilium_operator_replicas: 1

# ---------------------------------------------------------------------------
# Admin kubeconfig + CLI convenience (Phase 17)
# The RKE2 admin kubeconfig (/etc/rancher/rke2/rke2.yaml) is only for the
# platform admin. Developers get their OWN identities later (Phase 26).
# ---------------------------------------------------------------------------

# Platform admin who owns ~/.kube/config.
rke2_admin_user: "{{ platform_admin_user }}"

# kubeconfig server address. We prefer the stable Tailscale MagicDNS hostname
# (already in the serving cert tls-san) over the raw 100.x IP so kubectl over
# Tailscale presents a valid cert. Falls back to the raw IP if DNS is unset.
rke2_admin_kubeconfig_server: "{{ 'https://' ~ network.management_tailscale_dnsname ~ ':6443'
        if network.management_tailscale_dnsname is defined
        else 'https://127.0.0.1:6443' }}"

# RKE2-generated admin kubeconfig (root-only source of truth).
rke2_admin_kubeconfig_source: /etc/rancher/rke2/rke2.yaml
# Per-admin copy (absolute path; `~` does not expand in the copy task).
rke2_admin_kubeconfig_dest: "/home/{{ rke2_admin_user }}/.kube/config"