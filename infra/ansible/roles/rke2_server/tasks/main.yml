---
# rke2_server

# Version is pinned in defaults/main.yml (Phase 13):
#   rke2_minor   -> "v1.36"
#   rke2_version -> "v1.36.3+rke2r1"   (exact, tested)
# Phase 16 will run the installer with this exact version:
#   curl -sfL https://get.rke2.io | INSTALL_RKE2_VERSION='{{ rke2_version }}' sh -

# --- Phase 14: RKE2 configuration ---

- name: Create RKE2 config directory
  ansible.builtin.file:
    path: "{{ rke2_config_dir }}"
    state: directory
    owner: "{{ rke2_config_owner }}"
    group: "{{ rke2_config_group }}"
    mode: "0755"

- name: Render RKE2 config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ rke2_config_file }}"
    owner: "{{ rke2_config_owner }}"
    group: "{{ rke2_config_group }}"
    mode: "0644"

# --- Phase 14, sub-phase 23.1: kubelet configuration ---

- name: Create kubelet config drop-in directory
  ansible.builtin.file:
    path: "{{ rke2_kubelet_conf_dir }}"
    state: directory
    owner: "{{ rke2_config_owner }}"
    group: "{{ rke2_config_group }}"
    mode: "0755"

- name: Render kubelet config drop-in
  ansible.builtin.template:
    src: kubelet.conf.d/00-platform.conf.j2
    dest: "{{ rke2_kubelet_conf_file }}"
    owner: "{{ rke2_config_owner }}"
    group: "{{ rke2_config_group }}"
    mode: "0644"

# --- Phase 15: Cilium configuration (HelmChartConfig) ---

- name: Create RKE2 server manifests directory
  ansible.builtin.file:
    path: "{{ rke2_manifests_dir }}"
    state: directory
    owner: "{{ rke2_config_owner }}"
    group: "{{ rke2_config_group }}"
    mode: "0755"

- name: Render Cilium HelmChartConfig
  ansible.builtin.template:
    src: rke2-cilium-config.yaml.j2
    dest: "{{ rke2_cilium_config_file }}"
    owner: "{{ rke2_config_owner }}"
    group: "{{ rke2_config_group }}"
    mode: "0644"

# --- Phase 16: install and start RKE2 ---

- name: Check if RKE2 is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/rke2
  register: rke2_bin

- name: Install RKE2 if not already present
  when: not rke2_bin.stat.exists
  block:
    - name: Download the RKE2 installer script
      ansible.builtin.get_url:
        url: "{{ rke2_install_url }}"
        dest: "{{ rke2_install_script }}"
        mode: "0755"
        timeout: 60

    - name: Run the pinned RKE2 installer
      ansible.builtin.command:
        cmd: "INSTALL_RKE2_VERSION='{{ rke2_version }}' sh {{ rke2_install_script }}"
      environment:
        INSTALL_RKE2_TYPE: server
      register: rke2_install_result
      changed_when: true

    - name: Remove the installer script
      ansible.builtin.file:
        path: "{{ rke2_install_script }}"
        state: absent

- name: Enable rke2-server on boot
  ansible.builtin.systemd:
    name: rke2-server
    enabled: true
    daemon_reload: true

- name: Start rke2-server
  ansible.builtin.systemd:
    name: rke2-server
    state: started

# --- Phase 17: admin kubeconfig + CLI convenience ---

- name: Expose bundled kubectl for the admin
  ansible.builtin.file:
    src: /var/lib/rancher/rke2/bin/kubectl
    dest: /usr/local/bin/kubectl
    state: link

- name: Expose bundled crictl for the admin
  ansible.builtin.file:
    src: /var/lib/rancher/rke2/bin/crictl
    dest: /usr/local/bin/crictl
    state: link

# RKE2's containerd listens on a non-standard socket path; point crictl at it
# so `sudo crictl` works out of the box for the admin.
- name: Configure crictl to use the RKE2 containerd socket
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///run/k3s/containerd/containerd.sock
      image-endpoint: unix:///run/k3s/containerd/containerd.sock
      timeout: 10
      debug: false
    mode: "0644"

- name: Copy admin kubeconfig into the admin's ~/.kube/config
  ansible.builtin.copy:
    src: "{{ rke2_admin_kubeconfig_source }}"
    dest: "{{ rke2_admin_kubeconfig_dest }}"
    remote_src: true
    owner: "{{ rke2_admin_user }}"
    group: "{{ rke2_admin_user }}"
    mode: "0600"

# The generated rke2.yaml points the server at 127.0.0.1. Rewrite it to the
# stable Tailscale MagicDNS name so the admin can reach the API server over
# Tailscale with a valid serving certificate (matches the tls-san in config.yaml).
- name: Point admin kubeconfig server at the management hostname
  ansible.builtin.replace:
    path: "{{ rke2_admin_kubeconfig_dest }}"
    regexp: "https://127\\.0\\.0\\.1:6443"
    replace: "{{ rke2_admin_kubeconfig_server }}"

# --- k9s (companion kubectl UI, system-wide) ---
# k9s is not in the Ubuntu apt archive, so install the official pinned .deb
# (checksum-verified). Installed into /usr/bin/k9s so ALL users can run it
# against their own OIDC kubeconfig (Phase 27).
# Tagged `k9s` so it can be (re)run on its own:
#   sudo ansible-playbook -i inventory/production.yml ansible/site.yml \
#     --limit alpha --connection local --tags k9s
- name: Download the k9s .deb package
  ansible.builtin.get_url:
    url: "{{ rke2_k9s_deb_url }}"
    dest: "{{ rke2_k9s_deb_dest }}"
    mode: "0644"
    checksum: "sha256:{{ rke2_k9s_deb_checksum }}"
  tags: k9s

- name: Install k9s from the pinned .deb
  ansible.builtin.apt:
    deb: "{{ rke2_k9s_deb_dest }}"
    state: present
  tags: k9s

- name: Remove the staged k9s .deb
  ansible.builtin.file:
    path: "{{ rke2_k9s_deb_dest }}"
    state: absent
  tags: k9s
