---
# developer_kubeconfig — Phase 27: distribute a per-developer OIDC kubeconfig.
#
# Each developer on a tenant team gets their OWN copy of a kubeconfig at
# ~/.kube/config that authenticates through Dex via `kubectl oidc-login`
# (kubelogin, device-code flow, RFC 8628).
#
# WHY a copy per user and not one shared file:
#   - A kubeconfig's `user` is a NAME in the file, but the REAL identity comes
#     from the OIDC token kubelogin caches under each OS user's home
#     (~/.kube/cache/oidc-login). Sharing one file across accounts would
#     interleave token caches and mix identities.
#   - Each file lives in the developer's own home (mode 0600), so they control
#     who can read it.
#
# The Dex `kubernetes` client is PUBLIC (device-code grant), so the kubeconfig
# carries NO client secret — only the cluster CA and the issuer URL. There is
# nothing sensitive to leak, but we still chmod 0600 by convention.

# ---------------------------------------------------------------------------
# Who gets a kubeconfig. Derive from the tenant group membership so a user is
# onboarded/removed in ONE place (the group) — same source of truth as the
# `users` role. Each entry is a Linux username (their home must exist).
# ---------------------------------------------------------------------------
developer_kubeconfig_users:
  - jyao-42admin
  - ehammoud
  - mayan
  - mtangalv

# ---------------------------------------------------------------------------
# OIDC / Dex endpoint. The issuer URL MUST match what kube-apiserver uses
# (rke2_oidc_issuer_url) AND what Dex serves — kube-apiserver rejects an
# issuer mismatch. Reuse the RKE2 OIDC vars when present (single source of
# truth), with explicit fallbacks so this role is runnable standalone.
# ---------------------------------------------------------------------------
developer_kubeconfig_issuer_url: >-
  {{ rke2_oidc_issuer_url
     if rke2_oidc_issuer_url is defined
     else 'https://' ~ network.management_tailscale_dnsname
            if network.management_tailscale_dnsname is defined
            else 'https://localhost' }}
developer_kubeconfig_client_id: "{{ rke2_oidc_client_id | default('kubernetes') }}"
developer_kubeconfig_extra_scopes: "{{ rke2_oidc_extra_scopes | default(['groups', 'email']) }}"

# ---------------------------------------------------------------------------
# Cluster connection. The API server address over Tailscale (with a valid
# serving cert for the MagicDNS name) is the same one the admin uses. Reuse
# the RKE2 var with a fallback to the MagicDNS name.
# ---------------------------------------------------------------------------
developer_kubeconfig_server: >-
  {{ rke2_admin_kubeconfig_server
     if rke2_admin_kubeconfig_server is defined
     else 'https://' + network.management_tailscale_dnsname + ':6443'
            if network.management_tailscale_dnsname is defined
            else 'https://127.0.0.1:6443' }}
developer_kubeconfig_cluster_name: "alpha"
# Default namespace for the developer context. Sets the `namespace:` field in
# the context so every `kubectl` command defaults to the tenant's dev
# namespace (per-tenant override via developer_kubeconfig_namespace).
developer_kubeconfig_namespace: "dev-42wasd-admin"

# Pre-configured contexts for the tenant's namespaces. Each context wires a
# descriptive name -> {cluster, user, namespace}. Because all namespaces belong
# to the same tenant on the single alpha cluster, we encode tenant+lane in the
# context name (research-backed: descriptive, environment-encoded context
# names make `kubectl config use-context` switch namespace implicitly and
# avoid the "context with empty user -> basic-auth prompt" trap).
developer_kubeconfig_contexts:
  - name: dev
    namespace: dev-42wasd-admin
  - name: prd
    namespace: prd-42wasd-admin
  - name: games-dev
    namespace: dev-games-42wasd-admin
  - name: games-prd
    namespace: prd-games-42wasd-admin
  - name: mlops
    namespace: mlops

# CA data for the API server. By default pull it live from the root-only admin
# kubeconfig generated by RKE2 (this role runs with become), so the CA never
# has to be copied into Git. Override to pin a specific value if desired.
developer_kubeconfig_ca_file: /etc/rancher/rke2/rke2.yaml
# The CA data is read by the tasks from that file; this role stores it into
# the variable below so the template can embed it.