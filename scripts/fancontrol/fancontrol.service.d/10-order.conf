# 10-order.conf — pin fancontrol to the generated config
#
# The stock fancontrol.service (lm-sensors) only declares After=lm-sensors.service.
# On this host /etc/fancontrol is (re)written at boot by fancontrol-gen.service,
# which resolves the current it8613/k10temp hwmon indices. Without this drop-in
# there is no guarantee the generator has run first, and no protection against
# fancontrol starting against a stale config if the generator fails.
#
# Install (done by scripts/fancontrol/setup-it87.sh):
#   sudo mkdir -p /etc/systemd/system/fancontrol.service.d
#   sudo cp scripts/fancontrol/fancontrol.service.d/10-order.conf \
#           /etc/systemd/system/fancontrol.service.d/
[Unit]
Requires=fancontrol-gen.service
After=fancontrol-gen.service
