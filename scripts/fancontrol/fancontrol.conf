# fancontrol config — HUANANZHI H12D-8D (EPYC 7742, CPU fan via ITE IT8613E)
#
# Generated for scripts/fancontrol/ — see README.md before editing.
#
# Why this exists:
#   This board has NO BMC module installed (IPMI/VGA/SYS_FAN control require
#   the optional AST2500 SO-DIMM BMC card). The ITE IT8613E Super I/O chip
#   provides OS-level PWM control of the CPU fan header via the it87 driver:
#     * pwm2 = CPU fan header (fan2 tach; hardware floor ~2420 RPM below duty 50)
#     * temp source = k10temp Tctl (authoritative EPYC 7742 CPU temp)
#
# Curve design (EPYC 7742 TjMax ~75°C, idle Tctl ~49°C):
#   idle/quiet : duty 50 (fan floor ~2420 RPM) up to 55°C
#   ramp       : 55->70°C toward full speed
#   full speed : >= 70°C (5°C headroom below TjMax)
#
# NOTE: DEVPATH/DEVNAME let fancontrol re-resolve hwmonN indices at runtime,
#       so this config survives boot-order changes.
# Format: see fancontrol(8).
INTERVAL=10
DEVPATH=hwmon1=devices/platform/it87.2608 hwmon2=devices/pci0000:00/0000:00:18.3
DEVNAME=hwmon1=it8613 hwmon2=k10temp
FCTEMPS=hwmon1/pwm2=hwmon2/temp1_input
FCFANS=hwmon1/pwm2=hwmon1/fan2_input
MINTEMP=hwmon1/pwm2=40
MAXTEMP=hwmon1/pwm2=70
MINSTART=hwmon1/pwm2=55
MINSTOP=hwmon1/pwm2=45