# 50-platform-limits.conf — Phase 9: developer resource limits (normal profile)
#
# WHY: developers on alpha can run heavy local jobs (pytest -n64, make -j64,
# runaway Python, 10k child processes). Systemd puts each human user in a
# per-UID slice (user-<UID>.slice). Drop-ins here cap each user slice so a
# single developer can NEVER starve the 128-core host or exhaust memory.
#
# This is the "normal developer" profile from the reference design.
#
#   CPUQuota=400%  ~4 cores of scheduler time (host has 128, so this is safe)
#   MemoryHigh=8G  pressure/throttle boundary (soft)
#   MemoryMax=12G  hard cgroup ceiling (OOM inside the slice if exceeded)
#   TasksMax=4096  process/thread ceiling (stops a 10000-fork bomb)
#   IOWeight=50    lower I/O priority than default-weight services (100)
#
# Applied by: systemctl daemon-reload, then a new login session picks it up.
[Slice]
CPUQuota=400%
MemoryHigh=8G
MemoryMax=12G
TasksMax=4096
IOWeight=50