# 50-platform-limits.conf — Phase 9: developer resource limits (owner/boost)
#
# WHY the OWNER (jyao) gets a larger profile than normal developers: the owner
# is trusted to run heavier administration/build tasks and needs more headroom.
# Still bounded so even the owner can't exhaust the 128-core host.
#
#   CPUQuota=800%  ~8 cores
#   MemoryHigh=16G pressure boundary
#   MemoryMax=24G  hard ceiling
#   TasksMax=8192  higher process ceiling
#   IOWeight=75    higher I/O priority than normal developers (50)
#
[Slice]
CPUQuota=800%
MemoryHigh=16G
MemoryMax=24G
TasksMax=8192
IOWeight=75